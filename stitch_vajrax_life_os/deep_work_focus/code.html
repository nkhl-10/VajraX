<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>VAJRAX - Task Execution</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed": "#271900",
                        "surface-container-low": "#1f1b15",
                        "on-error": "#690005",
                        "on-secondary": "#2c3136",
                        "on-secondary-fixed": "#171c21",
                        "background": "#17130d",
                        "inverse-on-surface": "#343029",
                        "secondary-fixed-dim": "#c2c7cd",
                        "on-tertiary-fixed-variant": "#1f477d",
                        "primary-container": "#d6a84f",
                        "on-primary-container": "#583e00",
                        "on-tertiary": "#003063",
                        "primary-fixed-dim": "#f0bf64",
                        "error": "#ffb4ab",
                        "tertiary": "#afcbff",
                        "surface-container-high": "#2e2922",
                        "tertiary-fixed-dim": "#a9c7ff",
                        "on-background": "#eae1d6",
                        "inverse-surface": "#eae1d6",
                        "on-surface": "#eae1d6",
                        "surface": "#17130d",
                        "inverse-primary": "#7c5800",
                        "outline": "#9b8f7e",
                        "surface-tint": "#f0bf64",
                        "secondary-fixed": "#dee3ea",
                        "on-secondary-fixed-variant": "#42474d",
                        "surface-variant": "#39342d",
                        "on-tertiary-container": "#194278",
                        "surface-dim": "#17130d",
                        "surface-container": "#231f19",
                        "on-tertiary-fixed": "#001b3d",
                        "primary": "#f4c367",
                        "surface-container-lowest": "#110e08",
                        "outline-variant": "#4e4637",
                        "on-primary-fixed-variant": "#5e4200",
                        "on-secondary-container": "#b1b5bc",
                        "tertiary-container": "#8db0ed",
                        "on-primary": "#412d00",
                        "tertiary-fixed": "#d6e3ff",
                        "secondary": "#c2c7cd",
                        "secondary-container": "#42474d",
                        "surface-container-highest": "#39342d",
                        "surface-bright": "#3d3831",
                        "on-surface-variant": "#d2c5b2",
                        "on-error-container": "#ffdad6",
                        "primary-fixed": "#ffdea6",
                        "error-container": "#93000a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "unit": "8px",
                        "container-margin": "24px",
                        "stack-xl": "64px",
                        "stack-lg": "32px",
                        "stack-sm": "8px",
                        "stack-md": "16px"
                    },
                    "fontFamily": {
                        "body-md": ["Manrope"],
                        "display-lg": ["Manrope"],
                        "title-md": ["Manrope"],
                        "headline-lg-mobile": ["Manrope"],
                        "headline-lg": ["Manrope"],
                        "label-md": ["Manrope"],
                        "body-lg": ["Manrope"],
                        "label-sm": ["Manrope"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "title-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Subtle glow for the timer ring */
        .timer-ring-glow {
            filter: drop-shadow(0 0 12px rgba(244, 195, 103, 0.2));
        }
        
        /* Pulse animation for active timer */
        @keyframes subtlePulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.02); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        
        .timer-active .timer-text {
            animation: subtlePulse 4s infinite ease-in-out;
        }

        /* Neumorphic inset shadow */
        .inset-shadow-surface {
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.4), inset 0 1px 1px 0 rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-hidden antialiased">
<!-- Top App Bar (Modified for Task Focus) -->
<!-- Navigation shell is suppressed here as per rules for linear/task-focused flows -->
<header class="flex justify-between items-center w-full px-container-margin py-6 z-50 relative">
<button aria-label="Cancel" class="p-2 -ml-2 text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<div class="text-center">
<h1 class="text-title-md font-title-md text-on-surface">Deep Work</h1>
<p class="text-label-sm font-label-sm text-on-surface-variant mt-1 opacity-80 tracking-widest uppercase">09:00 - 10:00</p>
</div>
<button aria-hidden="true" aria-label="Menu" class="p-2 -mr-2 text-on-surface-variant hover:text-on-surface transition-colors opacity-0 pointer-events-none">
<span class="material-symbols-outlined">more_vert</span>
</button>
</header>
<!-- Main Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-container-margin relative z-10 w-full max-w-md mx-auto">
<!-- Background Ambient Glow -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none -z-10">
<div class="w-64 h-64 bg-primary/5 rounded-full blur-3xl mix-blend-screen"></div>
</div>
<!-- Timer Area -->
<div class="relative flex items-center justify-center w-72 h-72 mb-stack-lg timer-active">
<!-- SVG Timer Ring -->
<svg class="absolute inset-0 w-full h-full timer-ring-glow" viewbox="0 0 100 100">
<!-- Background track -->
<circle cx="50" cy="50" fill="none" r="46" stroke="#1f1b15" stroke-width="1.5"></circle>
<!-- Progress ring -->
<circle cx="50" cy="50" fill="none" r="46" stroke="#f4c367" stroke-dasharray="289" stroke-dashoffset="86.7" stroke-linecap="round" stroke-width="2" transform="rotate(-90 50 50)"></circle>
</svg>
<!-- Timer Text -->
<div class="text-center z-10 timer-text">
<div class="text-display-lg font-display-lg text-primary tracking-tighter tabular-nums leading-none mb-2">42:18</div>
<div class="text-label-md font-label-md text-on-surface-variant opacity-70 tracking-widest uppercase">Focus Time</div>
</div>
</div>
<!-- Task Info (Optional detail layer) -->
<div class="text-center mb-stack-xl max-w-xs">
<p class="text-body-md font-body-md text-on-surface-variant leading-relaxed">
                Stay entirely focused on the current objective. Eliminate distractions.
            </p>
</div>
<!-- Quick Actions (Completion Flow) -->
<div class="w-full grid grid-cols-3 gap-unit mb-stack-xl">
<!-- Pause / Skip -->
<button class="col-span-1 bg-surface-container text-on-surface border border-outline-variant/30 rounded-xl py-4 flex flex-col items-center justify-center hover:bg-surface-container-high transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined mb-1 text-on-surface-variant text-xl" style="font-variation-settings: 'FILL' 0;">pause</span>
<span class="text-label-md font-label-md">Pause</span>
</button>
<!-- Done (Primary Mastery) -->
<button class="col-span-2 bg-primary text-on-primary rounded-xl py-4 flex flex-row items-center justify-center shadow-lg shadow-primary/10 hover:opacity-90 transition-opacity active:scale-95 duration-150 relative overflow-hidden">
<!-- Subtle gloss effect -->
<div class="absolute inset-0 bg-gradient-to-t from-black/10 to-transparent pointer-events-none"></div>
<span class="material-symbols-outlined mr-2" style="font-variation-settings: 'FILL' 1;">check</span>
<span class="text-title-md font-title-md">Finish</span>
</button>
</div>
</main>
<!-- Bottom Action Bar (Evidence Triggers) -->
<!-- This replaces the standard navigation shell in task contexts -->
<div class="w-full bg-surface/80 backdrop-blur-xl border-t border-surface-container-highest px-container-margin py-4 pb-safe z-50">
<div class="flex items-center justify-between">
<div class="text-label-md font-label-md text-on-surface-variant">Add Evidence</div>
<div class="flex gap-4">
<button aria-label="Add Photo" class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface hover:text-primary transition-colors active:scale-90 border border-outline-variant/20">
<span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 0;">photo_camera</span>
</button>
<button aria-label="Add Note" class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface hover:text-primary transition-colors active:scale-90 border border-outline-variant/20">
<span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 0;">edit_note</span>
</button>
<button aria-label="Add Voice Note" class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface hover:text-primary transition-colors active:scale-90 border border-outline-variant/20">
<span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 0;">mic</span>
</button>
</div>
</div>
</div>
</body></html>
