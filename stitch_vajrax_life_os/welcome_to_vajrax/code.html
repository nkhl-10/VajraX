<!-- Top Section: Brand Identity -->
<div class="flex flex-col items-center text-center mt-12 animate-fade-in-up">
<!-- Geometric Logo placeholder (using Material Icon for now as abstract representation) -->
<div class="mb-6 text-primary">
<span class="material-symbols-outlined text-6xl" style="font-variation-settings: 'FILL' 1;">
                    diamond
                </span>
</div>
<h1 class="font-display-lg text-display-lg text-primary tracking-widest uppercase mb-2">
                VAJRAX
            </h1>
<p class="font-label-md text-label-md text-primary uppercase tracking-widest opacity-90">
                BUILD. DISCIPLINE. BECOME.
            </p>
</div>
<!-- Spacer to push actions down -->
<div class="flex-grow"></div>
<!-- Bottom Section: Actions Container -->
<div class="w-full flex flex-col gap-stack-md glass-panel p-6 rounded-[2rem] shadow-2xl animate-fade-in-up" style="animation-delay: 0.2s;">
<!-- Primary Action Button -->
<button class="w-full bg-primary text-on-primary font-title-md text-title-md py-4 px-6 rounded-xl shadow-lg transition-transform active:scale-[0.98] hover:bg-primary-fixed flex items-center justify-center gap-2">

            </button>
<!-- Secondary/Tertiary Action -->
<button class="w-full bg-transparent text-on-surface font-label-md text-label-md py-4 px-6 rounded-xl border border-surface-container-high transition-colors hover:bg-surface-container/50 active:bg-surface-container">

<div class="w-2 h-2 rounded-full bg-surface-container-high"></div>

</div>
</div>

<style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
