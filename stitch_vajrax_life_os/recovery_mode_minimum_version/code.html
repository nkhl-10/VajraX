<style>
        body {
            background-color: #0B0D0F; /* Void level 0 */
            color: #eae1d6;
            font-family: 'Manrope', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        
        .glass-veil {
            background: rgba(23, 19, 13, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .surface-card {
            background-color: #14181C; /* Level 1 Surface */
            border: 1px solid #1B2025;
        }

        .elevated-card {
            background-color: #1B2025; /* Level 2 Elevated */
        }
        
        /* Smooth fade in animation for recovery mode */
        @keyframes subtleReveal {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .reveal-delay-1 { animation: subtleReveal 0.8s ease-out 0.2s both; }
        .reveal-delay-2 { animation: subtleReveal 0.8s ease-out 0.4s both; }
        .reveal-delay-3 { animation: subtleReveal 0.8s ease-out 0.6s both; }
        .reveal-delay-4 { animation: subtleReveal 0.8s ease-out 0.8s both; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Atmospheric Background Element -->
<div class="absolute inset-0 z-0 opacity-20 pointer-events-none" style="background: radial-gradient(circle at 50% 30%, rgba(214, 168, 79, 0.05) 0%, rgba(11, 13, 15, 1) 70%);"></div>
<!-- Main Content Container -->
<main class="w-full max-w-md mx-auto px-container-margin py-stack-xl flex flex-col items-center justify-center min-h-screen relative z-10">
<!-- Icon / Graphic -->
<div class="mb-stack-lg reveal-delay-1 flex justify-center w-full">
<div class="w-24 h-24 rounded-full border border-outline-variant/30 flex items-center justify-center bg-surface-container-low/50 relative">
<!-- Inner soft glow -->
<div class="absolute inset-0 rounded-full bg-primary/5 blur-xl"></div>
<span class="material-symbols-outlined text-4xl text-primary font-light" style="font-variation-settings: 'wght' 200;">
                    restart_alt
                </span>
</div>
</div>
<!-- Header Text -->
<div class="text-center mb-stack-xl reveal-delay-2 w-full">
<h1 class="text-headline-lg-mobile font-headline-lg-mobile text-on-surface mb-unit tracking-tight">Pause &amp; Reset</h1>
<p class="text-body-lg font-body-lg text-on-surface-variant max-w-[280px] mx-auto leading-relaxed">
                Momentum ebbs and flows. Let's begin again with the smallest possible step.
            </p>
</div>
<!-- The "Next Move" Focus Area -->
<div class="w-full reveal-delay-3">
<div class="text-center mb-unit">
<span class="text-label-sm font-label-sm text-primary uppercase tracking-widest opacity-80">Your Next Move: Minimum Version</span>
</div>
<div class="surface-card rounded-xl p-stack-md relative overflow-hidden transition-transform duration-300 active:scale-[0.98]">
<!-- Subtle neumorphic inner shadow on the card -->
<div class="absolute inset-0 shadow-[inset_0_2px_4px_rgba(0,0,0,0.2)] pointer-events-none rounded-xl"></div>
<div class="flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full elevated-card flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-surface">self_improvement</span>
</div>
<div>
<h3 class="text-title-md font-title-md text-on-surface leading-tight">Breathe</h3>
<p class="text-body-md font-body-md text-on-surface-variant">5 Minutes • Clear Mind</p>
</div>
</div>
<div class="w-10 h-10 rounded-full border border-primary/30 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-xl">play_arrow</span>
</div>
</div>
</div>
</div>
<!-- Actions -->
<div class="w-full mt-stack-xl reveal-delay-4 flex flex-col gap-4">
<button class="w-full bg-primary text-on-primary-fixed text-title-md font-title-md py-4 rounded-lg hover:bg-primary-fixed transition-colors shadow-[0_4px_14px_rgba(244,195,103,0.15)] flex items-center justify-center gap-2">
                Begin Soft Restart
            </button>
<button class="w-full text-on-surface-variant text-body-md font-body-md py-3 hover:text-on-surface transition-colors flex items-center justify-center">
                I need more time
            </button>
</div>
</main>
</body></html>
