# Cloud Build: tests → image → Artifact Registry → Cloud Run. See deploy/DEPLOY.md.
# From the repository root, after deploy/gcp-setup.sh init:
#   gcloud builds submit --config deploy/cloudbuild.yaml \
#     --service-account "projects/$PROJECT_ID/serviceAccounts/vajrax-build@$PROJECT_ID.iam.gserviceaccount.com" \
#     --substitutions SHORT_SHA="$(git rev-parse --short HEAD)"
# Any _SETTING below can be changed the same way, e.g. --substitutions _PUBLIC_BASE_URL=https://vajrax.app,_SMTP_HOST=...

substitutions:
  _REGION: asia-south1
  _SERVICE: vajrax
  _REPOSITORY: vajrax
  _SQL_INSTANCE: vajrax-db
  _DB_NAME: vajrax
  _DB_USER: vajrax
  # Empty = the service's own address, https://<service>-<project number>.<region>.run.app
  _PUBLIC_BASE_URL: ""
  # Empty = no emails; password-reset links then can't be delivered (see DEPLOY.md › Email).
  _SMTP_HOST: ""
  _SMTP_PORT: "587"
  _SMTP_USER: ""
  _SMTP_FROM: "VAJRAX <no-reply@example.com>"
  # Apps older than this are asked to update before they sync.
  _MIN_APP_VERSION: "1.0"
  # 0 on plain Cloud Run, 1 behind an external Application Load Balancer (custom domain).
  _FORWARDED_SKIP_LAST: "0"
  _MIN_INSTANCES: "0"
  # Instances × DB pool (5) must stay below the database's connection limit (db-g1-small: 50).
  _MAX_INSTANCES: "8"
  _MEMORY: 1Gi

options:
  dynamicSubstitutions: true
  substitutionOption: ALLOW_LOOSE
  machineType: E2_HIGHCPU_8
  # Required when the build runs as its own service account (vajrax-build).
  logging: CLOUD_LOGGING_ONLY
  env:
    - DOCKER_BUILDKIT=1

timeout: 3600s

steps:
  - id: test
    name: gcr.io/cloud-builders/docker
    args: [build, -f, server/Dockerfile, --target, test, .]

  - id: image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - server/Dockerfile
      - --build-arg
      - GIT_SHA=${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/server:${BUILD_ID}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/server:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/server"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        url="${_PUBLIC_BASE_URL}"
        [ -n "$$url" ] || url="https://${_SERVICE}-${PROJECT_NUMBER}.${_REGION}.run.app"
        gcloud run deploy "${_SERVICE}" \
          --image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/server:${BUILD_ID}" \
          --region="${_REGION}" \
          --service-account="vajrax-run@${PROJECT_ID}.iam.gserviceaccount.com" \
          --allow-unauthenticated \
          --port=8080 \
          --cpu=1 \
          --memory="${_MEMORY}" \
          --cpu-boost \
          --concurrency=80 \
          --timeout=60s \
          --min-instances="${_MIN_INSTANCES}" \
          --max-instances="${_MAX_INSTANCES}" \
          --set-env-vars="^|^APP_ENV=production|PUBLIC_BASE_URL=$$url|DB_INSTANCE=${PROJECT_ID}:${_REGION}:${_SQL_INSTANCE}|DB_URL=jdbc:postgresql:///${_DB_NAME}|DB_USER=${_DB_USER}|DB_POOL_SIZE=5|SMTP_HOST=${_SMTP_HOST}|SMTP_PORT=${_SMTP_PORT}|SMTP_USER=${_SMTP_USER}|SMTP_FROM=${_SMTP_FROM}|MIN_APP_VERSION=${_MIN_APP_VERSION}|FORWARDED_SKIP_LAST=${_FORWARDED_SKIP_LAST}" \
          --set-secrets="JWT_SECRET=vajrax-jwt-secret:latest,DB_PASSWORD=vajrax-db-password:latest,JOBS_TOKEN=vajrax-jobs-token:latest,METRICS_TOKEN=vajrax-metrics-token:latest,SMTP_PASSWORD=vajrax-smtp-password:latest"
        echo "Deployed: $$url"
