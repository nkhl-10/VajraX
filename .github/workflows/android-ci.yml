name: Android CI & Build

on:
  push:
    branches: [ "main", "feature/figma-human-ui-redesign", "feature/habitflow-offline-mvp" ]
  pull_request:
    branches: [ "main", "feature/figma-human-ui-redesign", "feature/habitflow-offline-mvp" ]

jobs:
  build:
    name: Build & Assemble APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Quality gates: unit tests, then detekt (rules + ktlint formatting) and Android lint.
    # Both analysers compare against the committed baselines, so only new issues fail the build.
    - name: Unit tests
      run: ./gradlew :shared:testDebugUnitTest --stacktrace

    - name: Static analysis (detekt + ktlint)
      run: ./gradlew detekt --stacktrace

    - name: Android lint
      run: ./gradlew :shared:lintDebug :androidApp:lintDebug --stacktrace

    - name: Upload test and analysis reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: VajraX-Reports
        path: |
          shared/build/reports/tests/
          */build/reports/detekt/
          */build/reports/lint-results-*.html
        if-no-files-found: ignore

    - name: Build Android Debug APK
      run: ./gradlew :shared:compileDebugKotlinAndroid :androidApp:assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Lumina-LifeOS-Debug-APK
        path: androidApp/build/outputs/apk/debug/*.apk
        if-no-files-found: error

  server:
    name: Server, contract and web app
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Real PostgreSQL (embedded) for the server tests; no database service needed.
    - name: Server and contract tests
      run: ./gradlew :server:test :contract:jvmTest --stacktrace

    - name: Website and web app (production bundle)
      run: ./gradlew :server:stageWeb --stacktrace

    - name: Upload server test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: VajraX-Server-Reports
        path: server/build/reports/tests/
        if-no-files-found: ignore

  image:
    name: Server image smoke test (server/Dockerfile)
    runs-on: ubuntu-latest
    needs: server

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vajrax
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: vajrax
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U vajrax"
          --health-interval 5s --health-timeout 5s --health-retries 12

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Build the image Cloud Build deploys
      run: DOCKER_BUILDKIT=1 docker build -f server/Dockerfile --build-arg GIT_SHA=${GITHUB_SHA::7} -t vajrax-server .

    - name: Start it in production mode
      run: |
        docker run -d --name vajrax --network host \
          -e APP_ENV=production -e PORT=8080 -e PUBLIC_BASE_URL=https://ci.vajrax.invalid \
          -e DB_URL=jdbc:postgresql://localhost:5432/vajrax -e DB_USER=vajrax -e DB_PASSWORD=ci-only-password \
          -e JWT_SECRET="$(openssl rand -hex 32)" vajrax-server
        for i in $(seq 1 60); do curl -fs http://localhost:8080/readyz && exit 0; sleep 2; done
        exit 1

    - name: Smoke test
      run: |
        set -euo pipefail
        base=http://localhost:8080
        curl -fs $base/v1/version
        curl -fs -o /dev/null -D - $base/ | grep -i '^content-type: text/html'
        curl -fs -o /dev/null -D - $base/app/ | grep -i '^content-type: text/html'
        curl -fs -o /dev/null -D - $base/privacy-policy | grep -i '^content-type: text/html'
        test "$(curl -s -o /dev/null -w '%{http_code}' $base/nope)" = 404
        test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
          -d '{"email":"ci@example.com","password":"quiet morning tea"}' $base/v1/auth/register)" = 201

    - name: Server log
      if: always()
      run: docker logs vajrax || true
